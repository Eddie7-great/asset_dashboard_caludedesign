<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>임피클 × Eddie | 예약 작업 & Follow-up 현황판</title>
<style>
  :root {
    --bg: #f6f7fb;
    --surface: #ffffff;
    --surface-2: #f0f2f8;
    --text: #141824;
    --text-muted: #5f687d;
    --border: #e3e7f0;
    --accent: #6c5ce7;
    --accent-soft: rgba(108, 92, 231, 0.12);
    --green: #0ea572;
    --green-soft: rgba(14, 165, 114, 0.12);
    --amber: #d97706;
    --amber-soft: rgba(217, 119, 6, 0.12);
    --red: #e11d48;
    --red-soft: rgba(225, 29, 72, 0.12);
    --blue: #2563eb;
    --blue-soft: rgba(37, 99, 235, 0.12);
    --gray: #64748b;
    --gray-soft: rgba(100, 116, 139, 0.12);
    --shadow: 0 4px 18px rgba(20, 24, 36, 0.05);
  }
  [data-theme="dark"] {
    --bg: #0e1118;
    --surface: #161b26;
    --surface-2: #1e2534;
    --text: #eef1f7;
    --text-muted: #9aa4b8;
    --border: #262f42;
    --accent: #8b7cf6;
    --accent-soft: rgba(139, 124, 246, 0.16);
    --green: #34d399;
    --green-soft: rgba(52, 211, 153, 0.14);
    --amber: #fbbf24;
    --amber-soft: rgba(251, 191, 36, 0.14);
    --red: #fb7185;
    --red-soft: rgba(251, 113, 133, 0.15);
    --blue: #60a5fa;
    --blue-soft: rgba(96, 165, 250, 0.14);
    --gray: #94a3b8;
    --gray-soft: rgba(148, 163, 184, 0.15);
    --shadow: 0 6px 22px rgba(0, 0, 0, 0.32);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  .container {
    max-width: 1120px;
    margin: 0 auto;
    padding: 24px 18px 64px;
  }
  header {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 14px;
    margin-bottom: 22px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .avatar {
    width: 44px;
    height: 44px;
    border-radius: 14px;
    background: linear-gradient(135deg, #a78bfa, #6c5ce7);
    color: #fff;
    display: grid;
    place-items: center;
    font-weight: 800;
    font-size: 20px;
    box-shadow: var(--shadow);
  }
  h1 {
    margin: 0;
    font-size: clamp(1.2rem, 2.5vw, 1.55rem);
    letter-spacing: -0.02em;
  }
  .subtitle {
    margin: 2px 0 0;
    font-size: 0.86rem;
    color: var(--text-muted);
  }
  .header-actions {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .btn {
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    padding: 8px 13px;
    border-radius: 10px;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    transition: all .15s ease;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .kpis {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 12px;
    margin-bottom: 24px;
  }
  .kpi {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 15px 16px;
    box-shadow: var(--shadow);
  }
  .kpi-label { font-size: 0.8rem; color: var(--text-muted); font-weight: 600; }
  .kpi-val { font-size: 1.65rem; font-weight: 800; margin-top: 4px; letter-spacing: -0.03em; }
  .kpi-sub { font-size: 0.78rem; color: var(--text-muted); margin-top: 2px; }

  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 18px;
  }
  .tabs {
    display: flex;
    gap: 6px;
    background: var(--surface-2);
    padding: 4px;
    border-radius: 12px;
    border: 1px solid var(--border);
  }
  .tab {
    border: none;
    background: transparent;
    color: var(--text-muted);
    padding: 7px 14px;
    border-radius: 9px;
    font-size: 0.86rem;
    font-weight: 700;
    cursor: pointer;
  }
  .tab.active {
    background: var(--surface);
    color: var(--text);
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  }
  .search-wrap {
    flex: 1 1 240px;
    max-width: 340px;
  }
  .search {
    width: 100%;
    padding: 9px 14px;
    border-radius: 11px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-size: 0.9rem;
    outline: none;
  }
  .search:focus { border-color: var(--accent); }

  .section-head {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin: 26px 0 12px;
  }
  .section-title {
    font-size: 1.08rem;
    font-weight: 800;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .chip {
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-muted);
    padding: 5px 11px;
    border-radius: 999px;
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
  }
  .chip.active {
    background: var(--accent-soft);
    color: var(--accent);
    border-color: transparent;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 14px;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    gap: 10px;
    transition: transform .12s ease, opacity .15s ease;
  }
  .card.checked {
    opacity: 0.56;
  }
  .card.checked .card-title {
    text-decoration: line-through;
  }
  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;
  }
  .badges {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-items: center;
  }
  .badge {
    font-size: 0.74rem;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 7px;
    white-space: nowrap;
  }
  .b-active { background: var(--green-soft); color: var(--green); }
  .b-scheduled { background: var(--blue-soft); color: var(--blue); }
  .b-paused { background: var(--gray-soft); color: var(--gray); }
  .b-urgent { background: var(--red-soft); color: var(--red); }
  .b-waiting { background: var(--amber-soft); color: var(--amber); }
  .b-ongoing { background: var(--accent-soft); color: var(--accent); }
  .b-cat { background: var(--surface-2); color: var(--text-muted); }

  .card-title {
    margin: 0;
    font-size: 1rem;
    font-weight: 750;
    letter-spacing: -0.01em;
  }
  .meta-row {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    font-size: 0.8rem;
    color: var(--text-muted);
  }
  .card-body {
    font-size: 0.87rem;
    color: var(--text);
  }
  .block {
    background: var(--surface-2);
    border-radius: 10px;
    padding: 9px 11px;
    font-size: 0.83rem;
  }
  .block-label {
    font-size: 0.74rem;
    font-weight: 700;
    color: var(--text-muted);
    margin-bottom: 2px;
  }
  .check-btn {
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-muted);
    border-radius: 8px;
    padding: 4px 9px;
    font-size: 0.75rem;
    font-weight: 700;
    cursor: pointer;
    flex-shrink: 0;
  }
  .card.checked .check-btn {
    background: var(--green-soft);
    color: var(--green);
    border-color: transparent;
  }
  .empty {
    grid-column: 1 / -1;
    text-align: center;
    padding: 36px 16px;
    color: var(--text-muted);
    background: var(--surface);
    border: 1px dashed var(--border);
    border-radius: 16px;
  }
  footer {
    margin-top: 38px;
    text-align: center;
    font-size: 0.8rem;
    color: var(--text-muted);
  }

  .lock-screen {
    max-width: 420px;
    margin: 72px auto;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 26px 22px;
    box-shadow: var(--shadow);
    text-align: center;
  }
  .lock-screen h2 { margin: 8px 0 6px; font-size: 1.15rem; }
  .lock-screen p { margin: 0 0 16px; font-size: 0.86rem; color: var(--text-muted); }
  .lock-input {
    width: 100%;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text);
    font-size: 0.9rem;
    margin-bottom: 10px;
  }
  .lock-err { color: var(--red); font-size: 0.82rem; min-height: 18px; margin-bottom: 8px; }
</style>

</head>
<body>
<div class="lock-screen" id="lockScreen" style="display:none;">
  <div style="font-size:32px;">🔐</div>
  <h2>임피클 × Eddie 현황판</h2>
  <p>개인정보 보호를 위해 암호화되어 있습니다.<br/>전달받은 전용 링크로 열거나 키를 입력해 주세요.</p>
  <input class="lock-input" id="keyInput" type="password" placeholder="열람 키 입력..." />
  <div class="lock-err" id="lockErr"></div>
  <button class="btn" id="unlockBtn" style="width:100%;background:var(--accent);color:#fff;border:none;padding:10px;">열기</button>
</div>
<div class="container" id="appContainer" style="display:none;">
  <header>
    <div class="brand">
      <div class="avatar">ㅇ</div>
      <div>
        <h1>임피클 × Eddie 현황판</h1>
        <p class="subtitle">기준: 2026-11-18 19:15 KST · 예약된 작업 &amp; Follow-up 트래커</p>
      </div>
    </div>
    <div class="header-actions">
      <button class="btn" id="resetChecksBtn" title="로컬 체크 표시 초기화">체크 초기화</button>
      <button class="btn" id="themeBtn">🌙 다크 모드</button>
    </div>
  </header>

  <section class="kpis" id="kpis"></section>

  <div class="toolbar">
    <div class="tabs" role="tablist">
      <button class="tab active" data-view="all">전체 보기</button>
      <button class="tab" data-view="scheduled">⏰ 예약 작업</button>
      <button class="tab" data-view="followup">📌 Follow-up</button>
    </div>
    <div class="search-wrap">
      <input class="search" id="searchInput" type="search" placeholder="키워드 검색 (예: KT, 대출, 청약, 쏘렌토, 연말정산)..." />
    </div>
  </div>

  <div id="scheduledSection">
    <div class="section-head">
      <div class="section-title">⏰ 시스템 예약 작업 (Scheduled Actions)</div>
      <div class="chips" id="schedFilters">
        <button class="chip active" data-sf="all">전체</button>
        <button class="chip" data-sf="recurring">매일·실시간</button>
        <button class="chip" data-sf="once">날짜 지정 (D-Day)</button>
      </div>
    </div>
    <div class="grid" id="scheduledGrid"></div>
  </div>

  <div id="followupSection">
    <div class="section-head">
      <div class="section-title">📌 대화 Follow-up 현황 (Open Threads)</div>
      <div class="chips" id="fuFilters">
        <button class="chip active" data-ff="all">전체</button>
        <button class="chip" data-ff="urgent">🔥 오늘·기한임박</button>
        <button class="chip" data-ff="waiting">⏳ 답변·인증 대기</button>
        <button class="chip" data-ff="life">🏠 생활·통신·차량</button>
        <button class="chip" data-ff="finance">💰 금융·세금·보험</button>
        <button class="chip" data-ff="invest">📈 투자·대시보드</button>
        <button class="chip" data-ff="auto">🤖 자동화·행정</button>
      </div>
    </div>
    <div class="grid" id="followupGrid"></div>
  </div>

  <footer>
    개인정보 보호를 위해 외부 서버에 올리지 않은 로컬 전용 웹페이지입니다. 브라우저에서 체크한 완료 표시는 이 기기에만 저장됩니다.
  </footer>
</div>

  document.documentElement.setAttribute("data-theme", theme);
  document.getElementById("themeBtn").textContent = theme === "dark" ? "☀️ 라이트 모드" : "🌙 다크 모드";
  localStorage.setItem(THEME_KEY, theme);
}

const savedTheme = localStorage.getItem(THEME_KEY) || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
applyTheme(savedTheme);

document.getElementById("themeBtn").addEventListener("click", () => {
  const cur = document.documentElement.getAttribute("data-theme");
  applyTheme(cur === "dark" ? "light" : "dark");
});

document.getElementById("resetChecksBtn").addEventListener("click", () => {
  checkedSet.clear();
  saveChecked();
  render();
});

document.querySelectorAll(".tab").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    view = btn.dataset.view;
    render();
  });
});

document.getElementById("schedFilters").addEventListener("click", e => {
  if (!e.target.classList.contains("chip")) return;
  document.querySelectorAll("#schedFilters .chip").forEach(c => c.classList.remove("active"));
  e.target.classList.add("active");
  schedFilter = e.target.dataset.sf;
  render();
});

document.getElementById("fuFilters").addEventListener("click", e => {
  if (!e.target.classList.contains("chip")) return;
  document.querySelectorAll("#fuFilters .chip").forEach(c => c.classList.remove("active"));
  e.target.classList.add("active");
  fuFilter = e.target.dataset.ff;
  render();
});

document.getElementById("searchInput").addEventListener("input", e => {
  query = e.target.value.trim().toLowerCase();
  render();
});

function esc(s) {
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function renderKPIs() {
  const activeSch = SCHEDULED.filter(s => s.status === "active").length;
  const onceSch = SCHEDULED.filter(s => s.status === "scheduled").length;
  const urgentFu = FOLLOWUPS.filter(f => f.urgency === "urgent" && !checkedSet.has(f.id)).length;
  const doneCount = checkedSet.size;
  document.getElementById("kpis").innerHTML = `
    <div class="kpi"><div class="kpi-label">상시 가동 예약</div><div class="kpi-val" style="color:var(--green)">${activeSch}건</div><div class="kpi-sub">매일 출석·청약·SOXX 감시</div></div>
    <div class="kpi"><div class="kpi-label">날짜 지정 예약</div><div class="kpi-val" style="color:var(--blue)">${onceSch}건</div><div class="kpi-sub">가장 빠른 일정: 11-30 카드집계</div></div>
    <div class="kpi"><div class="kpi-label">Follow-up 총계</div><div class="kpi-val">${FOLLOWUPS.length}건</div><div class="kpi-sub">오늘·임박 ${urgentFu}건 남음</div></div>
    <div class="kpi"><div class="kpi-label">내 화면 완료 체크</div><div class="kpi-val" style="color:var(--accent)">${doneCount}건</div><div class="kpi-sub">카드 우측 체크로 관리</div></div>
  `;
}

function render() {
  renderKPIs();
  document.getElementById("scheduledSection").style.display = (view === "all" || view === "scheduled") ? "" : "none";
  document.getElementById("followupSection").style.display = (view === "all" || view === "followup") ? "" : "none";

  const schList = SCHEDULED.filter(item => {
    if (schedFilter !== "all" && item.type !== schedFilter) return false;
    if (query) {
      const hay = (item.title + " " + item.cadence + " " + item.desc).toLowerCase();
      if (!hay.includes(query)) return false;
    }
    return true;
  });

  const schGrid = document.getElementById("scheduledGrid");
  schGrid.innerHTML = schList.length ? schList.map(item => {
    const badgeClass = item.status === "active" ? "b-active" : (item.status === "paused" ? "b-paused" : "b-scheduled");
    return `
      <article class="card">
        <div class="card-top">
          <div class="badges">
            <span class="badge ${badgeClass}">${esc(item.statusLabel)}</span>
            ${item.dday ? `<span class="badge b-cat">${esc(item.dday)}</span>` : ""}
          </div>
        </div>
        <h3 class="card-title">${item.icon} ${esc(item.title)}</h3>
        <div class="meta-row">
          <span>🗓 ${esc(item.cadence)}</span>
          <span>⏭ ${esc(item.nextRun)}</span>
        </div>
        <div class="card-body">${esc(item.desc)}</div>
      </article>
    `;
  }).join("") : `<div class="empty">조건에 맞는 예약 작업이 없습니다.</div>`;

  const fuList = FOLLOWUPS.filter(item => {
    if (fuFilter === "urgent" && item.urgency !== "urgent") return false;
    else if (fuFilter === "waiting" && item.urgency !== "waiting") return false;
    else if (["life","finance","invest","auto"].includes(fuFilter) && item.category !== fuFilter) return false;
    if (query) {
      const hay = (item.title + " " + item.done + " " + item.next + " " + item.catLabel).toLowerCase();
      if (!hay.includes(query)) return false;
    }
    return true;
  });

  const fuGrid = document.getElementById("followupGrid");
  fuGrid.innerHTML = fuList.length ? fuList.map(item => {
    const isChecked = checkedSet.has(item.id);
    const uClass = item.urgency === "urgent" ? "b-urgent" : (item.urgency === "waiting" ? "b-waiting" : "b-ongoing");
    return `
      <article class="card ${isChecked ? "checked" : ""}" data-id="${item.id}">
        <div class="card-top">
          <div class="badges">
            <span class="badge ${uClass}">${esc(item.urgLabel)}</span>
            <span class="badge b-cat">${esc(item.catLabel)}</span>
          </div>
          <button class="check-btn" onclick="toggleCheck('${item.id}')">${isChecked ? "✓ 완료됨" : "완료 체크"}</button>
        </div>
        <h3 class="card-title">${esc(item.title)}</h3>
        <div class="meta-row"><span>👤 ${esc(item.owner)}</span></div>
        <div class="block">
          <div class="block-label">지금까지 진행</div>
          <div>${esc(item.done)}</div>
        </div>
        <div class="block">
          <div class="block-label">다음 액션</div>
          <div>${esc(item.next)}</div>
        </div>
      </article>
    `;
  }).join("") : `<div class="empty">조건에 맞는 Follow-up 항목이 없습니다.</div>`;
}

window.toggleCheck = function(id) {
  if (checkedSet.has(id)) checkedSet.delete(id);
  else checkedSet.add(id);
  saveChecked();
  render();
};



function b64ToBytes(b64) {
  const bin = atob(b64);
  const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return arr;
}

function b64UrlToBytes(b64u) {
  let b64 = b64u.replace(/-/g, "+").replace(/_/g, "/");
  while (b64.length % 4) b64 += "=";
  return b64ToBytes(b64);
}

async function tryUnlock(keyStr) {
  const keyBytes = b64UrlToBytes(keyStr.trim());
  const cryptoKey = await crypto.subtle.importKey("raw", keyBytes, { name: "AES-GCM" }, false, ["decrypt"]);
  const plainBuf = await crypto.subtle.decrypt(
    { name: "AES-GCM", iv: b64ToBytes(ENC_IV) },
    cryptoKey,
    b64ToBytes(ENC_CT)
  );
  const data = JSON.parse(new TextDecoder().decode(plainBuf));
  SCHEDULED = data.scheduled || [];
  FOLLOWUPS = data.followups || [];
  document.getElementById("lockScreen").style.display = "none";
  document.getElementById("appContainer").style.display = "";
  render();
}

async function boot() {
  const hash = location.hash || "";
  const m = hash.match(/key=([^&]+)/);
  if (m && m[1]) {
    try {
      await tryUnlock(decodeURIComponent(m[1]));
      return;
    } catch (e) {
      document.getElementById("lockErr").textContent = "링크의 키가 올바르지 않습니다.";
    }
  }
  document.getElementById("lockScreen").style.display = "";
}

document.getElementById("unlockBtn").addEventListener("click", async () => {
  const val = document.getElementById("keyInput").value;
  try {
    await tryUnlock(val);
    history.replaceState(null, "", "#key=" + encodeURIComponent(val.trim()));
  } catch (e) {
    document.getElementById("lockErr").textContent = "키가 올바르지 않습니다.";
  }
});

boot();
</script>
