name: 순자산 스냅샷 기록

# 앱은 브라우저를 열어야만 그날 순자산을 기록한다. 며칠 안 들어가면 그 날짜가
# 영구히 비어 순자산 추이의 기간 버튼이 전부 같은 구간을 보여주게 된다.
# 이 배치가 매일 같은 계산을 대신 수행해 기록의 공백을 없앤다.
on:
  schedule:
    # UTC 09:40 = KST 18:40 — 한국 장 마감 직후(ETF 수집 10분 뒤), 매일.
    # 주말에도 돌린다: 주식은 직전 종가로 유지되지만 가상화폐는 계속 움직이고,
    # 빈 날짜가 생기면 기간 버튼이 다시 무의미해진다.
    - cron: '40 9 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'KV에 쓰지 않고 계산 결과만 출력'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: net-worth-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: 의존성 설치
        run: uv sync --frozen --no-dev

      # 계산 규칙이 script.js와 어긋나면 순자산 추이가 통째로 왜곡되므로,
      # 기록 전에 항상 대조 테스트를 먼저 통과시킨다.
      - name: 계산 규칙 대조 테스트
        run: uv run --frozen python scripts/tests/test_net_worth_snapshot.py

      - name: 스냅샷 기록
        env:
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            uv run --frozen python scripts/net_worth_snapshot.py --dry-run
          else
            uv run --frozen python scripts/net_worth_snapshot.py
          fi
