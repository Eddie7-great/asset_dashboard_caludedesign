name: ETF 구성종목 수집

# 브라우저에서 외부 사이트를 직접 부르면 CORS 로 막히므로 수집은 CI 에서만 한다.
# 결과(data/etf_holdings.json)를 커밋하고, 대시보드는 그 파일만 읽는다.
on:
  # 수집 코드가 main에 반영되면 예약 시각을 기다리지 않고 즉시 한 번 갱신한다.
  # Actions가 만든 data/etf_holdings.json 커밋은 아래 경로에 없으므로 재실행 루프가 생기지 않는다.
  push:
    branches: [main]
    paths:
      - '.github/workflows/etf-holdings.yml'
      - 'scripts/collect_etf_holdings.py'
      - 'scripts/etf_common.py'
      - 'pyproject.toml'
      - 'requirements.txt'
      - 'uv.lock'
  schedule:
    - cron: '30 9 * * 1-5'      # UTC 09:30 = KST 18:30, 평일
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: etf-holdings
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: 의존성 설치
        run: uv sync --frozen --no-dev

      # BROWSER_SOURCES가 비어 있어 현재 브라우저 폴백은 사용하지 않는다.
      # Playwright/Chromium을 매번 설치하면 실제 수집 전에 불필요한 네트워크 장애 지점이 생긴다.

      # GitHub hosted runner에서는 일부 국내 운용사 사이트가 데이터센터 IP를 차단한다.
      # 네트워크가 불안정한 해외주식형 ETF를 하드 게이트로 쓰지 않고, 실제 보유 중이며
      # KRX가 비중까지 공시하는 KODEX·TIGER·SOL 국내주식형 ETF로 수집 경로를 검증한다.
      # 운용사 공식 API와 외부 HTML 파서는 아래 네트워크 없는 단위 테스트에서 별도 검증한다.
      - name: 여러 운용사 스모크 테스트
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: |
          uv run --frozen python scripts/collect_etf_holdings.py --smoke 069500
          uv run --frozen python scripts/collect_etf_holdings.py --smoke 0117V0
          uv run --frozen python scripts/collect_etf_holdings.py --smoke 0167A0

      - name: 파서 단위 테스트
        run: |
          uv run --frozen python scripts/tests/test_parse_krx_pdf.py
          uv run --frozen python scripts/tests/test_domestic_sources.py
          node scripts/tests/test_lookthrough_owner_scope.mjs
          node scripts/tests/test_risk_page.mjs
          node scripts/tests/test_dividend_sort.mjs
          node scripts/tests/test_holdings_dashboard_ui.mjs

      - name: 구성종목 수집
        env:
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: uv run --frozen python scripts/collect_etf_holdings.py

      - name: 수집 결과 전달
        uses: actions/upload-artifact@v4
        with:
          name: etf-holdings-${{ github.run_id }}
          path: data/etf_holdings.json
          if-no-files-found: error
          retention-days: 1

  persist:
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 수집 결과 받기
        uses: actions/download-artifact@v4
        with:
          name: etf-holdings-${{ github.run_id }}
          path: data

      - name: 변경분 커밋
        run: |
          if git diff --quiet -- data/etf_holdings.json; then
            echo "변경 없음 — 커밋하지 않습니다."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/etf_holdings.json
          git commit -m "chore(data): ETF 구성종목 갱신 $(date -u -d '+9 hours' +%Y-%m-%d)"
          git push
