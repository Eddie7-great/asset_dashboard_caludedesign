name: ETF 구성종목 수집

# 브라우저에서 외부 사이트를 직접 부르면 CORS 로 막히므로 수집은 CI 에서만 한다.
# 결과(data/etf_holdings.json)를 커밋하고, 대시보드는 그 파일만 읽는다.
on:
  # 수집 코드가 main에 반영되면 예약 시각을 기다리지 않고 즉시 한 번 갱신한다.
  # Actions가 만든 data/etf_holdings.json 커밋은 아래 경로에 없으므로 재실행 루프가 생기지 않는다.
  push:
    branches: [main]
    paths:
      - '.github/workflows/etf-holdings.yml'
      - 'scripts/collect_etf_holdings.py'
      - 'scripts/etf_common.py'
      - 'requirements.txt'
  schedule:
    - cron: '30 9 * * 1-5'      # UTC 09:30 = KST 18:30, 평일
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: etf-holdings
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install playwright          # 4순위 폴백용

      - name: Chromium 설치
        run: playwright install --with-deps chromium

      # 국내·해외 주식형 ETF를 여러 운용사에서 확인한다. 1~2줄만 나오면 잘못된 것이므로
      # 여기서 job 을 실패시켜 잘못된 데이터 커밋을 막는다.
      # KRX_ID/KRX_PW 는 선택 사항 — 없으면 ZEROIN 공통 소스로 수집한다.
      # (KRX 는 회원 로그인을 요구하도록 바뀌어, 자격이 없으면 400 만 돌아온다)
      - name: 여러 운용사 스모크 테스트
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: |
          python scripts/collect_etf_holdings.py --smoke 069500
          python scripts/collect_etf_holdings.py --smoke 133690
          python scripts/collect_etf_holdings.py --smoke 433330

      - name: 파서 단위 테스트
        run: |
          python scripts/tests/test_parse_krx_pdf.py
          python scripts/tests/test_domestic_sources.py
          node scripts/tests/test_lookthrough_owner_scope.mjs
          node scripts/tests/test_risk_page.mjs
          node scripts/tests/test_dividend_sort.mjs

      - name: 구성종목 수집
        env:
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: python scripts/collect_etf_holdings.py

      - name: 변경분 커밋
        run: |
          if git diff --quiet -- data/etf_holdings.json; then
            echo "변경 없음 — 커밋하지 않습니다."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/etf_holdings.json
          git commit -m "chore(data): ETF 구성종목 갱신 $(date -u -d '+9 hours' +%Y-%m-%d)"
          git push
