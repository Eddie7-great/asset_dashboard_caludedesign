name: 세금·증여 공식 근거 점검

on:
  schedule:
    - cron: '17 21 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tax-rules.js
      - scripts/check-tax-rule-sources.mjs
      - .github/workflows/tax-rule-watch.yml

concurrency:
  group: tax-rule-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      scan_outcome: ${{ steps.scan.outcome }}
      scan_code: ${{ steps.scan.outputs.code }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: 의존성 설치
        run: npm ci --ignore-scripts

      # 종료 코드를 그대로 남긴다 — 1(진짜 신호)과 2(전부 접속 실패)를 뒤 단계가 구분해야 한다.
      # outcome 만으로는 둘 다 'failure' 라 구분되지 않는다.
      - name: 공식 출처와 검토기한 확인
        id: scan
        continue-on-error: true
        run: |
          set +e
          npm run check:tax-rules:remote -- --report "${{ runner.temp }}/tax-rule-report.json"
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit $code

      - name: 점검 보고서 보관
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tax-rule-report
          path: ${{ runner.temp }}/tax-rule-report.json
          if-no-files-found: error
          retention-days: 14

  notify:
    needs: check
    if: always() && needs.check.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: 점검 보고서 받기
        uses: actions/download-artifact@v8
        with:
          name: tax-rule-report
          path: tax-rule-report

      - name: 검토 이슈 열기 또는 닫기
        uses: actions/github-script@v9
        env:
          SCAN_OUTCOME: ${{ needs.check.outputs.scan_outcome }}
          SCAN_CODE: ${{ needs.check.outputs.scan_code }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- tax-rule-watch -->';
            const title = '[Tax Rules] 공식 출처 검토 필요';
            const report = JSON.parse(fs.readFileSync('tax-rule-report/tax-rule-report.json', 'utf8'));
            const { owner, repo } = context.repo;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', per_page: 100,
            });
            const existing = issues.find(issue => !issue.pull_request && issue.title === title && String(issue.body || '').includes(marker));
            const failed = process.env.SCAN_OUTCOME !== 'success';
            // 종료 코드 2 = 한 곳도 못 읽음. 규칙이 바뀐 게 아니라 사이트에 닿지 못한 것이므로
            // 이슈 첫 줄에서 그 사실을 분명히 밝힌다 — 둘을 섞어 쓰면 진짜 변경을 놓친다.
            const outage = process.env.SCAN_CODE === '2';
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            if (failed) {
              const affected = (report.sources || []).filter(source => source.state !== 'ok');
              const lines = affected.length
                ? affected.map(source => `- \`${source.id}\`: ${source.state}${source.errorCode ? ` (${source.errorCode})` : ''}`)
                : (report.validation?.errors || []).map(message => `- ${message}`);
              const body = [
                marker,
                outage
                  ? '**공식 출처에 한 곳도 접속하지 못했습니다.** 세금 규칙이 바뀐 신호가 아니라, law.go.kr 에 닿지 못해 *확인을 못 한* 상태입니다. 접속이 회복되면 이 이슈는 자동으로 닫힙니다. 며칠 이상 이어지면 출처 URL이 살아 있는지 직접 확인하세요.'
                  : '공식 법령·국세청 출처 또는 사람 검토기한 확인이 필요합니다.',
                '',
                `- 규칙 버전: \`${report.manifestVersion || 'unknown'}\``,
                `- 확인 시각: ${report.checkedAt || 'unknown'}`,
                `- 검토 상태: ${report.reviewState || 'unknown'}`,
                `- 실행: ${runUrl}`,
                '',
                '확인 대상:',
                ...(lines.length ? lines : ['- 보고서 생성 상태를 확인하세요.']),
                '',
                '공식 본문을 검토한 뒤 `tax-rules.js`의 값·가정·제외 항목·검토일을 함께 갱신하세요. 자동으로 세율을 바꾸지 않습니다.',
              ].join('\n');
              if (existing) await github.rest.issues.update({ owner, repo, issue_number: existing.number, body });
              else await github.rest.issues.create({ owner, repo, title, body });
            } else if (existing) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: existing.number,
                body: `${marker}\n공식 출처 점검이 다시 통과했습니다. 실행: ${runUrl}`,
              });
              await github.rest.issues.update({ owner, repo, issue_number: existing.number, state: 'closed' });
            }

  result:
    needs: [check, notify]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      # 실행을 빨갛게 만드는 기준은 '확인해야 할 것이 생겼는가' 하나다.
      # law.go.kr 접속 장애(코드 2)까지 빨갛게 만들면 장애가 이어지는 동안 매일 같은 빨간 X 가
      # 쌓이고, 그 사이에 낀 진짜 규칙 변경을 지나치게 된다. 그래서 경고로 낮춘다 —
      # 검토 이슈는 notify 가 이미 열어 두므로 사실이 묻히지는 않는다.
      - name: 점검 결과 반영
        env:
          SCAN_CODE: ${{ needs.check.outputs.scan_code }}
          NOTIFY_RESULT: ${{ needs.notify.result }}
        run: |
          if [ "$NOTIFY_RESULT" != "success" ]; then
            echo "검토 이슈 알림 단계가 실패했습니다."
            exit 1
          fi
          case "$SCAN_CODE" in
            0)
              echo "공식 출처 점검 통과."
              ;;
            2)
              echo "::warning title=공식 출처 접속 실패::law.go.kr 에 한 곳도 접속하지 못했습니다. 세금 규칙이 바뀐 것이 아니라 확인을 못 한 상태입니다. 자세한 내용은 열린 검토 이슈를 보세요."
              ;;
            *)
              echo "세금·증여 규칙 점검에서 확인할 항목이 나왔습니다 (종료 코드 ${SCAN_CODE:-없음})."
              exit 1
              ;;
          esac
