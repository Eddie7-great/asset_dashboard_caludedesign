name: probe-sources (temporary)
on:
  push:
    branches: [claude/project-thread-ehru0x]
    paths: [.github/workflows/probe-sources.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        run: |
          UA="Mozilla/5.0"
          getent hosts api.upbit.com || echo "no dns upbit"; getent hosts api.bithumb.com || echo "no dns bithumb"
          for u in \
            "https://api.upbit.com/v1/ticker?markets=KRW-BTC" \
            "https://api.bithumb.com/public/ticker/BTC_KRW" \
            "https://m.stock.naver.com/front-api/crypto/otherExchange?nfTicker=BTC&excludeExchange=UPBIT" \
            "https://m.stock.naver.com/front-api/crypto/top?exchangeType=UPBIT&sortType=top&pageSize=3" \
            "https://m.stock.naver.com/front-api/marketIndex/productDetail?category=exchange&reutersCode=FX_JPYKRW" \
            "https://m.stock.naver.com/front-api/marketIndex/productDetail?category=exchange&reutersCode=FX_AUDKRW" ; do
            echo "=================== $u"
            curl -sS -m 20 -A "$UA" -H "Referer: https://m.stock.naver.com/" -w "\nHTTP %{http_code}\n" "$u" | head -c 1500
            echo
          done
          echo "=================== gold totalInfos"
          curl -sS -m 20 -A "$UA" "https://m.stock.naver.com/front-api/marketIndex/productDetail?category=metals&reutersCode=M04020000" | python3 -c "import sys,json; d=json.load(sys.stdin)['result']; print(json.dumps({k:d.get(k) for k in ['closePrice','fluctuations','marketStatus','localTradedAt','marketIndexTotalInfos']},ensure_ascii=False))"
          echo "=================== naver price list for after-close semantic (yesterday KOSDAQ etc)"
          curl -sS -m 20 -A "$UA" "https://m.stock.naver.com/api/stock/035420/price?pageSize=10&page=1" | head -c 400; echo
          date -u
