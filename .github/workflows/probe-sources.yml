name: probe-sources (temporary)
on:
  push:
    branches: [claude/project-thread-ehru0x]
    paths: [.github/workflows/probe-sources.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        run: |
          UA="Mozilla/5.0"
          for u in \
            "https://m.stock.naver.com/api/stock/005930/price?pageSize=3&page=1" \
            "https://m.stock.naver.com/api/stock/360750/price?pageSize=3&page=1" \
            "https://m.stock.naver.com/api/stock/0117V0/price?pageSize=3&page=1" \
            "https://m.stock.naver.com/api/stock/005930/basic" \
            "https://polling.finance.naver.com/api/realtime/domestic/stock/005930" \
            "https://m.stock.naver.com/front-api/marketIndex/productDetail?category=exchange&reutersCode=FX_USDKRW" \
            "https://m.stock.naver.com/front-api/marketIndex/prices?category=exchange&reutersCode=FX_USDKRW&page=1&pageSize=3" \
            "https://m.stock.naver.com/front-api/marketIndex/prices?category=exchange&reutersCode=FX_JPYKRW&page=1&pageSize=2" \
            "https://m.stock.naver.com/front-api/marketIndex/prices?category=exchange&reutersCode=FX_AUDKRW&page=1&pageSize=2" \
            "https://m.stock.naver.com/front-api/marketIndex/productDetail?category=metals&reutersCode=M04020000" \
            "https://m.stock.naver.com/front-api/marketIndex/prices?category=metals&reutersCode=M04020000&page=1&pageSize=3" \
            "https://api.upbit.com/v1/ticker?markets=KRW-BTC,KRW-ETH" \
            "https://api.upbit.com/v1/candles/days?market=KRW-BTC&count=2" ; do
            echo "=================== $u"
            curl -sS -m 20 -A "$UA" -H "Referer: https://m.stock.naver.com/" -w "\nHTTP %{http_code}\n" "$u" | head -c 2500
            echo
          done
          date -u
