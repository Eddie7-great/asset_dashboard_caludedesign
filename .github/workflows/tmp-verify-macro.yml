name: tmp verify macro fred
on:
  push:
    branches: [claude/project-thread-uhcfau]
    paths: ['.github/workflows/tmp-verify-macro.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - name: run refresh once
        env:
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
        run: |
          cat > ./v.cjs <<'JS'
          const ts = require('typescript'), fs = require('fs'), Module = require('module'), path = require('path');
          const file = path.resolve('api/macro.ts');
          const out = ts.transpileModule(fs.readFileSync(file, 'utf8'), { compilerOptions: { module: ts.ModuleKind.CommonJS, target: ts.ScriptTarget.ES2022 } }).outputText;
          const m = new Module(file); m.filename = file; m.paths = Module._nodeModulePaths(path.dirname(file)); m._compile(out, file);
          (async () => {
            const before = await m.exports.readCache();
            console.log('cache before:', before ? Object.fromEntries(Object.entries(before.series).map(([k, v]) => [k, v.date])) : 'empty');
            const r = await m.exports.refreshFredCache({ force: true });
            console.log('REPORT', JSON.stringify(r, null, 1));
            const p = m.exports.macroPayload(await m.exports.readCache());
            console.log('PAYLOAD', JSON.stringify(p));
            const r2 = await m.exports.refreshFredCache({ force: true });
            console.log('SECOND RUN cacheUpdated =', r2.cacheUpdated);
          })().catch(e => { console.error(e); process.exit(1); });
          JS
          node ./v.cjs
