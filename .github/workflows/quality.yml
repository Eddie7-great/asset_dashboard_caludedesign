name: 품질 검사

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: 의존성 설치
        run: npm ci --ignore-scripts

      - name: 문법·타입·회귀 테스트
        run: npm test

      - name: 세금·증여 규칙 구조와 검토기한 확인
        run: npm run check:tax-rules

      - name: 운영 의존성 보안 감사
        run: npm audit --omit=dev --audit-level=high
