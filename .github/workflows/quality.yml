name: 품질 검사

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: 의존성 설치
        run: npm ci --ignore-scripts

      - name: Python 회귀 테스트 의존성 설치
        # 반드시 블록 스칼라로 둔다 — 평문 스칼라에는 콜론+공백(': ')이 들어갈 수 없는데
        # `--only-binary=:all:` 뒤의 공백이 정확히 그것이라, 인라인으로 쓰면 워크플로 전체가
        # 파싱되지 않아 잡이 하나도 생성되지 않는다. scripts/tests/test_workflow_yaml.mjs 가 지킨다.
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: numpy "pandas>=2.0.0,<3.0.0"

      - name: 문법·타입·회귀 테스트
        run: npm test

      - name: 세금·증여 규칙 구조와 검토기한 확인
        run: npm run check:tax-rules

      - name: 운영 의존성 보안 감사
        run: npm audit --omit=dev --audit-level=high
