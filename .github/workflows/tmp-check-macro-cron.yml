name: tmp check macro cron (read only)
on:
  push:
    branches: [claude/project-thread-uhcfau]
    paths: ['.github/workflows/tmp-check-macro-cron.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: production route answers (no auth)
        run: |
          for p in /api/macro /api/nope-404-check; do
            echo "$p -> $(curl -s -o /dev/null -w '%{http_code}' https://asset-dashboard-caludedesign.vercel.app$p)"
          done
          echo "/api/macro body: $(curl -s https://asset-dashboard-caludedesign.vercel.app/api/macro | head -c 200)"
      - name: FRED latest observation from this runner (read only)
        run: |
          set +e
          for id in DGS10 SP500 VIXCLS; do
            curl -s -m 20 -o /tmp/h2.csv -A 'asset-dashboard/1.0' "https://fred.stlouisfed.org/graph/fredgraph.csv?id=$id&cosd=2026-11-15"; e2=$?
            curl -s --http1.1 -m 20 -o /tmp/h1.csv -w '%{http_code}' -A 'asset-dashboard/1.0' "https://fred.stlouisfed.org/graph/fredgraph.csv?id=$id&cosd=2026-11-15" > /tmp/h1.code; e1=$?
            echo "$id curl-h2 exit=$e2 | curl-h1.1 exit=$e1 code=$(cat /tmp/h1.code) head=$(head -c 40 /tmp/h1.csv | tr '\n' ' ') last=$(grep -E '^[0-9]{4}-' /tmp/h1.csv | grep -vE ',(\.)?$' | tail -n 1)"
          done
          cat > ./f.mjs <<'JS'
          const ids = ['DGS10','T10Y2Y','BAA10Y','DTWEXBGS','DGS2','DFF','WALCL','SP500','SAHMREALTIME','VIXCLS'];
          await Promise.all(ids.map(async id => {
            const t0 = Date.now();
            try {
              const c = new AbortController(); const tm = setTimeout(() => c.abort(), 8000);
              const r = await fetch(`https://fred.stlouisfed.org/graph/fredgraph.csv?id=${id}&cosd=2026-11-15`, { headers: { 'User-Agent': 'asset-dashboard/1.0', Accept: 'text/csv' }, signal: c.signal });
              const txt = await r.text(); clearTimeout(tm);
              const rows = txt.trim().split('\n').filter(l => /^\d{4}-/.test(l) && !/,(\.)?$/.test(l));
              console.log('node', id, r.status, (Date.now()-t0)+'ms', 'head=' + JSON.stringify(txt.slice(0, 30)), 'last=' + rows[rows.length-1]);
            } catch (e) { console.log('node', id, 'ERROR', (Date.now()-t0)+'ms', String(e && (e.cause && e.cause.code || e.message) || e)); }
          }));
          JS
          node ./f.mjs
          exit 0
      - name: read macro KV keys (GET only)
        env:
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
        run: |
          cat > ./c.mjs <<'JS'
          const url = String(process.env.KV_REST_API_URL || '').replace(/\/+$/, '');
          const token = String(process.env.KV_REST_API_TOKEN || '');
          const kv = async (cmd) => { const r = await fetch(url, { method: 'POST', headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' }, body: JSON.stringify(cmd) }); const d = await r.json(); return d.result; };
          console.log('NOW_UTC', new Date().toISOString());
          console.log('macro_fred_checked =', JSON.stringify(await kv(['GET', 'macro_fred_checked'])));
          const raw = await kv(['GET', 'macro_fred']);
          const c = raw ? JSON.parse(raw) : null;
          console.log('cache.updatedAt =', c && c.updatedAt);
          for (const [id, e] of Object.entries((c && c.series) || {})) console.log(id.padEnd(13), 'date', e.date, 'value', e.value, 'prev', e.prevDate, e.prevValue, 'fetchedAt', e.fetchedAt);
          JS
          node ./c.mjs
